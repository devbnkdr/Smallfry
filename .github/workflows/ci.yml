name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt, and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg libimage-exiftool-perl
      - run: pip install PyQt6 pytest ruff
      - run: ruff check .
      - run: bash -n install.sh
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
